<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidatures hôtels</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --mute:#77756f; --line:#e4e2dc; --accent:#1f5f4a; --warn:#b5541b; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  .badge { padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .test { background:#fde8d8; color:var(--warn); } .live { background:#dcefe2; color:var(--ok); }
  .stat { color:var(--mute); }
  main { padding:16px 20px 90px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input, select, button, textarea { font:inherit; }
  input[type=text], input[type=number], select { padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  button { padding:7px 13px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  progress { width:240px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { font-size:12px; color:var(--mute); font-weight:600; background:#faf9f7; }
  tr.done td { opacity:.45; } tr.sel { background:#f1f7f4; }
  td.nom a { color:var(--mute); font-size:12px; text-decoration:none; }
  .email select { max-width:330px; }
  .why { font-size:11px; color:var(--mute); }
  .warn { color:var(--warn); font-size:12px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:min(640px, 100%); background:var(--card); border-left:1px solid var(--line); box-shadow:-10px 0 30px rgba(0,0,0,.08); padding:18px; display:none; flex-direction:column; gap:10px; z-index:10; }
  #panel.open { display:flex; }
  #panel textarea { flex:1; width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; line-height:1.55; resize:none; }
  #panel input { width:100%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .small { font-size:12px; color:var(--mute); }
  #log { font-size:12px; color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Candidatures hôtels</h1>
  <span id="mode" class="badge"></span>
  <span class="stat" id="quota"></span>
  <span class="stat" id="envoi"></span>
</header>

<main>
  <div class="bar">
    <input type="text" id="ville" placeholder="Ville ou arrondissement (ex : Lyon, Paris 8e Arrondissement)" size="40">
    <input type="number" id="limite" value="120" min="10" max="500" title="Nombre max d'hôtels" style="width:80px">
    <button class="primary" id="btnScan">Scanner</button>
    <label class="small">ou importer un CSV <input type="file" id="csv" accept=".csv"></label>
    <progress id="prog" value="0" max="1" hidden></progress><span id="progTxt" class="small"></span>
  </div>
  <div class="bar">
    <select id="recherche"></select>
    <label class="small"><input type="checkbox" id="masquer" checked> masquer envoyés / ignorés / sans adresse</label>
    <button id="btnAuto">Sélection auto</button>
    <button id="btnNone">Tout décocher</button>
    <span class="small" id="compte"></span>
  </div>
  <table>
    <thead><tr><th></th><th>Hôtel</th><th>Type</th><th>★ / ch.</th><th>Adresse e-mail</th><th>Statut</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<footer>
  <button class="primary" id="btnSend">Envoyer la sélection</button>
  <span id="selInfo" class="small"></span>
  <span id="log" class="grow"></span>
  <button id="btnHist">Historique</button>
</footer>

<aside id="panel">
  <div class="row"><strong id="pNom" class="grow"></strong><button id="pPrev">←</button><button id="pNext">→</button><button id="pClose">Fermer</button></div>
  <div class="small">À : <span id="pTo"></span> · Pièce jointe : <span id="pCv"></span></div>
  <input type="text" id="pObjet">
  <textarea id="pCorps"></textarea>
  <div class="row">
    <button class="primary" id="pSave">Enregistrer</button>
    <button id="pReset">Revenir au modèle</button>
    <span class="small grow" id="pInfo"></span>
  </div>
</aside>

<script>
const $ = s => document.querySelector(s);
const SEG = {independant:"Indépendant", intermediaire:"Intermédiaire", groupe:"Groupe / chaîne", luxe:"Luxe 5★"};
let hotels = [], selected = new Set(), state = {}, current = null;

async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.erreur || r.statusText);
  return j;
}

async function refreshState() {
  state = await api("/api/etat");
  $("#mode").textContent = state.mode_test ? "MODE TEST (envoi vers vous)" : "ENVOI RÉEL";
  $("#mode").className = "badge " + (state.mode_test ? "test" : "live");
  $("#quota").textContent = `Envoyés aujourd'hui : ${state.envoyes_aujourdhui} / ${state.limite}`;
  const e = state.envoi;
  $("#envoi").textContent = e.en_cours ? `Envoi : ${e.en_cours} (${e.en_attente} en attente)` :
                            (e.en_attente ? `${e.en_attente} en attente` : "");
  $("#log").textContent = e.erreurs.slice(-2).join(" · ");
  const s = state.scan;
  $("#prog").hidden = !s.actif;
  $("#btnScan").disabled = s.actif;
  if (s.actif) { $("#prog").max = s.total || 1; $("#prog").value = s.fait; $("#progTxt").textContent = `${s.fait} / ${s.total || "?"} sites analysés`; }
  else $("#progTxt").textContent = s.erreur ? "Erreur : " + s.erreur : "";
  return state;
}

async function loadRecherches(select) {
  const list = await api("/api/recherches");
  $("#recherche").innerHTML = `<option value="">Toutes les recherches</option>` +
    list.map(r => `<option value="${esc(r.recherche)}">${esc(r.recherche)} (${r.n})</option>`).join("");
  if (select !== undefined) $("#recherche").value = select;
}

async function loadHotels() {
  const q = $("#recherche").value;
  hotels = await api("/api/hotels" + (q ? "?recherche=" + encodeURIComponent(q) : ""));
  const ids = new Set(hotels.map(h => h.id));
  selected = new Set([...selected].filter(id => ids.has(id) && sendable(hotels.find(h => h.id === id))));
  render();
}

function sendable(h) { return h && h.statut !== "envoye" && h.statut !== "ignore" && h.email_choisi && !h.deja_envoye; }
function chosenScore(h) { const c = h.emails.find(c => c.email === h.email_choisi); return c ? c.score : 0; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function autoSelect() {
  selected.clear();
  const seen = new Set();
  for (const h of visible()) {
    if (!sendable(h) || chosenScore(h) < state.score_min) continue;
    if (seen.has(h.email_choisi)) continue;  // même adresse pour 2 hôtels (chaîne) : une seule fois
    seen.add(h.email_choisi); selected.add(h.id);
  }
  render();
}

function visible() {
  return $("#masquer").checked ? hotels.filter(sendable) : hotels;
}

function render() {
  const dupes = {};
  hotels.forEach(h => { if (h.email_choisi) dupes[h.email_choisi] = (dupes[h.email_choisi] || 0) + 1; });
  $("#rows").innerHTML = visible().map(h => {
    const opts = h.emails.map(c => `<option value="${esc(c.email)}" ${c.email === h.email_choisi ? "selected" : ""}>
        ${c.deja_envoye ? "✔ " : ""}${esc(c.email)} (${c.score})</option>`).join("");
    const c = h.emails.find(c => c.email === h.email_choisi);
    const statut = h.statut === "envoye" || h.deja_envoye ? "Envoyé" : h.statut === "ignore" ? "Ignoré" :
                   h.statut === "erreur" ? "Erreur" : "";
    return `<tr data-id="${h.id}" class="${selected.has(h.id) ? "sel" : ""} ${sendable(h) ? "" : "done"}">
      <td><input type="checkbox" class="chk" ${selected.has(h.id) ? "checked" : ""} ${sendable(h) ? "" : "disabled"}></td>
      <td class="nom"><div>${esc(h.nom)}</div><a href="${esc(h.site)}" target="_blank">${esc(h.ville || "")} · ${esc((h.site || "").replace(/^https?:\/\/(www\.)?/, "").slice(0, 40))}</a></td>
      <td><select class="seg">${Object.entries(SEG).map(([k, v]) => `<option value="${k}" ${k === h.segment ? "selected" : ""}>${v}</option>`).join("")}</select>
          ${h.marque ? `<div class="why">${esc(h.marque)}</div>` : ""}</td>
      <td>${h.etoiles ? h.etoiles + "★" : "–"} / ${h.chambres || "–"}</td>
      <td class="email">${h.emails.length ? `<select class="mail">${opts}<option value="__autre">Autre adresse…</option></select>` :
          `<button class="autre">Saisir une adresse</button>`}
          <div class="why">${c ? esc(c.raisons.join(" · ")) : ""}${dupes[h.email_choisi] > 1 ? ` <span class="warn">adresse partagée avec un autre hôtel</span>` : ""}</div></td>
      <td>${statut}</td>
      <td><button class="voir">Aperçu</button> ${sendable(h) ? `<button class="ign" title="Ne plus proposer cet hôtel">✕</button>` : ""}</td></tr>`;
  }).join("");
  $("#compte").textContent = `${visible().length} hôtels affichés sur ${hotels.length}`;
  $("#selInfo").textContent = `${selected.size} sélectionné(s)`;
  $("#btnSend").disabled = !selected.size;
}

$("#rows").addEventListener("change", async e => {
  const tr = e.target.closest("tr"), id = +tr.dataset.id, h = hotels.find(h => h.id === id);
  if (e.target.classList.contains("chk")) { e.target.checked ? selected.add(id) : selected.delete(id); return render(); }
  if (e.target.classList.contains("seg")) { await api(`/api/hotel/${id}`, {segment:e.target.value}); h.segment = e.target.value; }
  if (e.target.classList.contains("mail")) {
    let v = e.target.value;
    if (v === "__autre") { v = prompt("Adresse e-mail :"); if (!v) return render(); }
    await setEmail(h, v);
  }
});
$("#rows").addEventListener("click", async e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const id = +tr.dataset.id, h = hotels.find(h => h.id === id);
  if (e.target.classList.contains("voir")) openPanel(id);
  if (e.target.classList.contains("autre")) { const v = prompt("Adresse e-mail :"); if (v) await setEmail(h, v); }
  if (e.target.classList.contains("ign")) { await api(`/api/hotel/${id}`, {statut:"ignore"}); selected.delete(id); loadHotels(); }
});

async function setEmail(h, v) {
  v = v.trim().toLowerCase();
  await api(`/api/hotel/${h.id}`, {email_choisi:v});
  if (!h.emails.find(c => c.email === v)) h.emails.unshift({email:v, score:100, raisons:["saisie manuelle"], source:"manuel"});
  h.email_choisi = v; loadHotels();
}

async function openPanel(id) {
  current = id;
  const h = hotels.find(h => h.id === id), a = await api(`/api/apercu/${id}`);
  $("#pNom").textContent = h.nom;
  $("#pTo").textContent = a.email || "(aucune adresse)";
  $("#pCv").textContent = a.cv;
  $("#pObjet").value = a.objet; $("#pCorps").value = a.corps;
  $("#pInfo").textContent = a.perso ? "Texte personnalisé pour cet hôtel" : "Texte généré depuis le modèle (" + SEG[h.segment] + ")";
  $("#panel").classList.add("open");
}
function step(d) {
  const list = visible(), i = list.findIndex(h => h.id === current);
  if (list[i + d]) openPanel(list[i + d].id);
}
$("#pNext").onclick = () => step(1); $("#pPrev").onclick = () => step(-1);
$("#pClose").onclick = () => $("#panel").classList.remove("open");
$("#pSave").onclick = async () => {
  await api(`/api/hotel/${current}`, {objet_perso:$("#pObjet").value, corps_perso:$("#pCorps").value});
  $("#pInfo").textContent = "Enregistré ✔";
};
$("#pReset").onclick = async () => { await api(`/api/hotel/${current}`, {objet_perso:null, corps_perso:null}); openPanel(current); };
document.addEventListener("keydown", e => {
  if (!$("#panel").classList.contains("open") || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); if (e.key === "Escape") $("#pClose").onclick();
});

$("#btnScan").onclick = async () => {
  const ville = $("#ville").value.trim(); if (!ville) return;
  try { await api("/api/scan", {ville, limite:+$("#limite").value}); } catch (err) { return alert(err.message); }
  poll(ville);
};
$("#csv").onchange = async e => {
  const fd = new FormData(); fd.append("fichier", e.target.files[0]);
  await fetch("/api/import", {method:"POST", body:fd}); poll("import " + e.target.files[0].name);
};
async function poll(recherche) {
  const s = await refreshState();
  if (s.scan.actif) return setTimeout(() => poll(recherche), 1500);
  await loadRecherches(recherche); await loadHotels(); autoSelect();
}

$("#recherche").onchange = loadHotels;
$("#masquer").onchange = render;
$("#btnAuto").onclick = autoSelect;
$("#btnNone").onclick = () => { selected.clear(); render(); };
$("#btnSend").onclick = async () => {
  const n = selected.size;
  const msg = state.mode_test ? `MODE TEST : ${n} mails vont vous être envoyés à vous-même. Continuer ?`
                              : `Envoyer ${n} candidatures pour de vrai ?`;
  if (!confirm(msg)) return;
  const r = await api("/api/envoyer", {ids:[...selected]});
  selected.clear();
  $("#log").textContent = `${r.en_file} mail(s) en file d'envoi` + (r.refuses.length ? ` · refusés (doublon/quota) : ${r.refuses.join(", ")}` : "");
  watchSending();
};
async function watchSending() {
  const s = await refreshState();
  await loadHotels();
  if (s.envoi.en_attente || s.envoi.en_cours) setTimeout(watchSending, 3000);
}
$("#btnHist").onclick = async () => {
  const h = await api("/api/historique");
  alert(h.length ? h.map(r => `${r.envoye_le.replace("T", " ")}  ${r.hotel_nom}  <${r.email}>`).join("\n") : "Aucun envoi pour l'instant.");
};

(async () => { await refreshState(); await loadRecherches(); await loadHotels(); if (state.scan.actif) poll(state.scan.recherche); })();
</script>
</body>
</html>
