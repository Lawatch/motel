<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --mute:#77756f; --line:#e4e2dc; --accent:#1f5f4a; --warn:#b5541b; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  .badge { padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .test { background:#fde8d8; color:var(--warn); } .live { background:#dcefe2; color:var(--ok); }
  .stat { color:var(--mute); } .stat a { color:var(--mute); }
  .alerte { background:#fde8d8; color:var(--warn); padding:10px 20px; font-weight:600; }
  main { padding:16px 20px 90px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input, select, button, textarea { font:inherit; }
  input[type=text], input[type=number], input[type=email], select { padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  button { padding:7px 13px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  progress { width:240px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { font-size:12px; color:var(--mute); font-weight:600; background:#faf9f7; }
  tr.done td { opacity:.45; } tr.sel { background:#f1f7f4; }
  td.nom a { color:var(--mute); font-size:12px; text-decoration:none; }
  .email select { max-width:330px; }
  .why { font-size:11px; color:var(--mute); }
  .warn { color:var(--warn); font-size:12px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; }
  .panel { position:fixed; top:0; right:0; bottom:0; width:min(640px, 100%); background:var(--card); border-left:1px solid var(--line); box-shadow:-10px 0 30px rgba(0,0,0,.08); padding:18px; display:none; flex-direction:column; gap:10px; z-index:10; }
  .panel.open { display:flex; }
  .panel textarea { flex:1; width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; line-height:1.55; resize:none; }
  .panel input { width:100%; }
  #histListe { flex:1; overflow:auto; font-size:13px; }
  #histListe div { padding:6px 0; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .small { font-size:12px; color:var(--mute); }
  #log { font-size:12px; color:var(--warn); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.25); display:none; align-items:center; justify-content:center; z-index:20; }
  #modal.open { display:flex; }
  #modal > div { background:#fff; border-radius:10px; padding:20px; max-width:420px; display:flex; flex-direction:column; gap:14px; }
</style>
</head>
<body>
<div id="alerte" class="alerte" hidden></div>
<header>
  <h1>Candidatures hôtels</h1>
  <span class="badge live">Envoi direct aux hôtels</span>
  <span class="stat" id="cv"></span>
  <span class="stat" id="quota"></span>
  <span class="stat" id="compte"></span>
  <span class="stat" id="envoi"></span>
</header>

<main>
  <div class="bar">
    <input type="text" id="ville" placeholder="Une ou plusieurs villes : Lyon, Annecy, Paris 8e Arrondissement" size="48">
    <input type="number" id="limite" value="120" min="10" max="400" title="Nombre max d'hôtels" style="width:80px">
    <button class="primary" id="btnScan">Scanner</button>
    <progress id="prog" value="0" max="1" hidden></progress><span id="progTxt" class="small"></span>
  </div>
  <div class="bar">
    <select id="recherche"></select>
    <label class="small"><input type="checkbox" id="masquer" checked> masquer envoyés / ignorés / sans adresse</label>
    <button id="btnAuto">Sélection auto</button>
    <button id="btnNone">Tout décocher</button>
    <span class="small" id="nbAffiches"></span>
  </div>
  <table>
    <thead><tr><th></th><th>Hôtel</th><th>Type</th><th>★ / ch.</th><th>Adresse e-mail</th><th>Statut</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<footer>
  <button class="primary" id="btnSend">Envoyer la sélection</button>
  <button id="btnStop" hidden>Arrêter</button>
  <span id="selInfo" class="small"></span>
  <span id="log" class="grow"></span>
  <button id="btnHist">Historique</button>
</footer>

<aside id="panel" class="panel">
  <div class="row"><strong id="pNom" class="grow"></strong><button id="pPrev">←</button><button id="pNext">→</button><button id="pClose">Fermer</button></div>
  <div class="small">À : <span id="pTo"></span> · Pièce jointe : <span id="pCv"></span></div>
  <input type="text" id="pObjet">
  <textarea id="pCorps"></textarea>
  <div class="row">
    <button class="primary" id="pSave">Enregistrer</button>
    <button id="pReset">Revenir au modèle</button>
    <span class="small grow" id="pInfo"></span>
  </div>
</aside>

<aside id="hist" class="panel">
  <div class="row"><strong class="grow">Candidatures envoyées</strong><button id="hClose">Fermer</button></div>
  <div id="histListe"></div>
</aside>

<div id="modal"><div>
  <div id="mTexte"></div>
  <input type="email" id="mInput" hidden placeholder="adresse@hotel.fr">
  <div class="row" style="justify-content:flex-end"><button id="mNon">Annuler</button><button class="primary" id="mOui">OK</button></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const SEG = {independant:"Indépendant", intermediaire:"Intermédiaire", groupe:"Groupe / chaîne", luxe:"Luxe 5★"};
const LOT = 6, EN_PARALLELE = 6;  // 6 appels Apps Script en même temps, 6 hôtels chacun
let hotels = [], selected = new Set(), considered = new Set(), state = {}, current = null;
let stop = false, sending = false, scanning = false;

function run(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok)
    .withFailureHandler(e => ko(e && e.message ? e : new Error(String(e))))[fn](...args));
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function dialog(texte, saisie) {
  return new Promise(res => {
    $("#mTexte").textContent = texte;
    $("#mInput").hidden = !saisie; $("#mInput").value = "";
    $("#modal").classList.add("open");
    if (saisie) $("#mInput").focus();
    const fin = v => { $("#modal").classList.remove("open"); $("#mOui").onclick = $("#mNon").onclick = null; res(v); };
    $("#mOui").onclick = () => fin(saisie ? $("#mInput").value.trim() : true);
    $("#mNon").onclick = () => fin(saisie ? "" : false);
  });
}

async function refreshState() {
  state = await run("etat");
  $("#cv").innerHTML = state.cv.ok ? `<a href="${esc(state.cv.url)}" target="_blank">CV du ${esc(state.cv.date)}</a>`
                                   : `<span class="warn">${esc(state.cv.erreur)}</span>`;
  $("#quota").textContent = `Envoyés aujourd'hui : ${state.envoyesAujourdhui} / ${state.limite}`;
  $("#compte").innerHTML = `Depuis ${esc(state.compte)} · <a href="${esc(state.sheetUrl)}" target="_blank">suivi (Sheet)</a> · v${esc(state.version)}`;
  $("#alerte").hidden = state.bonCompte;
  $("#alerte").textContent = `Ce script tourne sur ${state.compte} : les envois sont bloqués. Installez-le sur le compte prévu dans les réglages.`;
}

async function loadRecherches(select) {
  const list = await run("recherches");
  $("#recherche").innerHTML = `<option value="">Toutes les recherches</option>` +
    list.map(r => `<option value="${esc(r.recherche)}">${esc(r.recherche)} (${r.n})</option>`).join("");
  if (select !== undefined) $("#recherche").value = select;
}

async function loadHotels() {
  hotels = await run("listeHotels", $("#recherche").value || null);
  const ids = new Set(hotels.map(h => h.id));
  selected = new Set([...selected].filter(id => ids.has(id) && sendable(hotels.find(h => h.id === id))));
  render();
}

function sendable(h) { return h && h.statut === "nouveau" && h.email_choisi && !h.deja_envoye; }
function chosenScore(h) { const c = h.emails.find(c => c.email === h.email_choisi); return c ? c.score : 0; }
function visible() { return $("#masquer").checked ? hotels.filter(sendable) : hotels; }

function autoSelect(reset = true) {
  if (reset) { selected.clear(); considered.clear(); }
  const seen = new Set(hotels.filter(h => selected.has(h.id)).map(h => h.email_choisi));
  for (const h of visible()) {
    if (!sendable(h) || considered.has(h.id)) continue;
    considered.add(h.id);   // un hôtel décoché à la main n'est pas recoché au rafraîchissement suivant
    if (chosenScore(h) < state.scoreMin || seen.has(h.email_choisi)) continue;
    seen.add(h.email_choisi); selected.add(h.id);   // même adresse pour 2 hôtels (chaîne) : une seule fois
  }
  render();
}

function render() {
  const partage = {};
  hotels.forEach(h => { if (h.email_choisi) partage[h.email_choisi] = (partage[h.email_choisi] || 0) + 1; });
  $("#rows").innerHTML = visible().map(h => {
    const opts = h.emails.map(c => `<option value="${esc(c.email)}" ${c.email === h.email_choisi ? "selected" : ""}>
        ${c.deja_envoye ? "✔ " : ""}${esc(c.email)} (${c.score})</option>`).join("");
    const c = h.emails.find(c => c.email === h.email_choisi);
    const statut = h.statut === "envoye" || h.deja_envoye ? "Envoyé" : h.statut === "ignore" ? "Ignoré" :
                   h.statut === "a_analyser" ? "Non analysé" : "";
    return `<tr data-id="${h.id}" class="${selected.has(h.id) ? "sel" : ""} ${sendable(h) ? "" : "done"}">
      <td><input type="checkbox" class="chk" ${selected.has(h.id) ? "checked" : ""} ${sendable(h) ? "" : "disabled"}></td>
      <td class="nom"><div>${esc(h.nom)}</div><a href="${esc(h.site)}" target="_blank">${esc(h.ville || "")} · ${esc((h.site || "").replace(/^https?:\/\/(www\.)?/, "").slice(0, 40))}</a></td>
      <td><select class="seg">${Object.entries(SEG).map(([k, v]) => `<option value="${k}" ${k === h.segment ? "selected" : ""}>${v}</option>`).join("")}</select>
          ${h.marque ? `<div class="why">${esc(h.marque)}</div>` : ""}</td>
      <td>${h.etoiles ? h.etoiles + "★" : "–"} / ${h.chambres || "–"}</td>
      <td class="email">${h.emails.length ? `<select class="mail">${opts}<option value="__autre">Autre adresse…</option></select>` :
          `<button class="autre">Saisir une adresse</button>`}
          <div class="why">${c ? esc(c.raisons.join(" · ")) : ""}${partage[h.email_choisi] > 1 ? ` <span class="warn">adresse partagée avec un autre hôtel</span>` : ""}</div></td>
      <td>${statut}</td>
      <td><button class="voir">Aperçu</button> ${sendable(h) ? `<button class="ign" title="Ne plus proposer cet hôtel">✕</button>` : ""}</td></tr>`;
  }).join("");
  $("#nbAffiches").textContent = `${visible().length} hôtels affichés sur ${hotels.length}`;
  $("#selInfo").textContent = `${selected.size} sélectionné(s)`;
  $("#btnSend").disabled = !selected.size || sending;
}

$("#rows").addEventListener("change", async e => {
  const tr = e.target.closest("tr"), id = +tr.dataset.id, h = hotels.find(h => h.id === id);
  if (e.target.classList.contains("chk")) { e.target.checked ? selected.add(id) : selected.delete(id); return render(); }
  if (e.target.classList.contains("seg")) { h.segment = e.target.value; await run("modifierHotel", id, {segment:h.segment}); }
  if (e.target.classList.contains("mail")) {
    let v = e.target.value;
    if (v === "__autre") { v = await dialog("Adresse e-mail pour " + h.nom + " :", true); if (!v) return render(); }
    await setEmail(h, v);
  }
});
$("#rows").addEventListener("click", async e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const id = +tr.dataset.id, h = hotels.find(h => h.id === id);
  if (e.target.classList.contains("voir")) openPanel(id);
  if (e.target.classList.contains("autre")) { const v = await dialog("Adresse e-mail pour " + h.nom + " :", true); if (v) await setEmail(h, v); }
  if (e.target.classList.contains("ign")) { h.statut = "ignore"; selected.delete(id); render(); await run("modifierHotel", id, {statut:"ignore"}); }
});

async function setEmail(h, v) {
  v = v.trim().toLowerCase();
  if (!h.emails.find(c => c.email === v)) h.emails.unshift({email:v, score:100, raisons:["saisie manuelle"], source:"manuel"});
  h.email_choisi = v;
  if (h.statut === "a_analyser") h.statut = "nouveau";
  await run("modifierHotel", h.id, {email_choisi:v, statut:h.statut});
  loadHotels();
}

async function openPanel(id) {
  current = id;
  const h = hotels.find(h => h.id === id), a = await run("apercu", id);
  $("#pNom").textContent = h.nom;
  $("#pTo").textContent = a.email || "(aucune adresse)";
  $("#pCv").textContent = a.cv;
  $("#pObjet").value = a.objet; $("#pCorps").value = a.corps;
  $("#pInfo").textContent = a.perso ? "Texte personnalisé pour cet hôtel" : "Texte généré depuis le modèle (" + SEG[h.segment] + ")";
  $("#panel").classList.add("open");
}
function step(d) {
  const list = visible(), i = list.findIndex(h => h.id === current);
  if (list[i + d]) openPanel(list[i + d].id);
}
$("#pNext").onclick = () => step(1); $("#pPrev").onclick = () => step(-1);
$("#pClose").onclick = () => $("#panel").classList.remove("open");
$("#pSave").onclick = async () => {
  await run("modifierHotel", current, {objet_perso:$("#pObjet").value, corps_perso:$("#pCorps").value});
  $("#pInfo").textContent = "Enregistré ✔";
};
$("#pReset").onclick = async () => { await run("modifierHotel", current, {objet_perso:"", corps_perso:""}); openPanel(current); };
document.addEventListener("keydown", e => {
  if (!$("#panel").classList.contains("open") || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); if (e.key === "Escape") $("#pClose").onclick();
});

function progress(fait, total, texte) {
  $("#prog").hidden = false; $("#prog").max = total || 1; $("#prog").value = fait;
  $("#progTxt").textContent = texte;
}

$("#btnScan").onclick = async () => {
  const villes = $("#ville").value.trim(); if (!villes) return;
  $("#btnScan").disabled = true; $("#log").textContent = "";
  try {
    progress(0, 1, "Recherche des hôtels sur OpenStreetMap…");
    const r = await run("scanVille", villes, +$("#limite").value);
    $("#progTxt").textContent = `${r.total} hôtels trouvés (${r.nouveaux} nouveaux)`;
    await loadRecherches(r.recherches.length === 1 ? r.recherches[0] : "");
    await loadHotels();
    analyser();
  } catch (err) {
    $("#progTxt").textContent = "Erreur : " + err.message;
  } finally {
    $("#btnScan").disabled = false;
  }
};

// Analyse des sites : plusieurs appels en parallèle ; les hôtels apparaissent au fur et à mesure
// et on peut commencer à envoyer sans attendre la fin. Page fermée, l'analyse continue en arrière-plan.
async function analyser() {
  if (scanning) return;
  scanning = true;
  let fait = 0, dernierRefresh = 0;
  const total = (await run("etat")).aAnalyser;
  const worker = async () => {
    while (true) {
      let n = 0;
      try { n = await run("analyserProchains", LOT); } catch (err) { $("#log").textContent = "Analyse : " + err.message; await sleep(3000); continue; }
      if (!n) return;
      fait += n;
      progress(fait, total, `${fait} / ${total} sites analysés - vous pouvez déjà envoyer`);
      if (Date.now() - dernierRefresh > 4000) { dernierRefresh = Date.now(); await loadHotels(); autoSelect(false); }
    }
  };
  await Promise.all(Array.from({length: EN_PARALLELE}, worker));
  scanning = false;
  progress(1, 1, `Analyse terminée (${fait} sites)`);
  await loadRecherches($("#recherche").value); await loadHotels(); autoSelect(false);
}

$("#recherche").onchange = loadHotels;
$("#masquer").onchange = render;
$("#btnAuto").onclick = () => autoSelect(true);
$("#btnNone").onclick = () => { selected.clear(); render(); };
$("#btnStop").onclick = () => { stop = true; $("#btnStop").disabled = true; };

$("#btnSend").onclick = async () => {
  // anti-doublon côté page aussi : une adresse une seule fois par lot
  const vus = new Set(), ids = [];
  for (const h of hotels) if (selected.has(h.id) && !vus.has(h.email_choisi)) { vus.add(h.email_choisi); ids.push(h.id); }
  const reste = state.limite - state.envoyesAujourdhui;
  if (ids.length > reste) ids.length = Math.max(reste, 0);
  if (!ids.length) return dialog("Limite du jour atteinte.");
  const ok = await dialog(`Envoyer ${ids.length} candidature(s) aux hôtels ? Gardez cet onglet ouvert pendant l'envoi.`);
  if (!ok) return;
  sending = true; stop = false; $("#btnStop").hidden = false; $("#btnStop").disabled = false; render();
  let n = 0; const erreurs = [];
  for (const id of ids) {
    if (stop) break;
    const h = hotels.find(h => h.id === id);
    $("#envoi").textContent = `Envoi ${n + 1} / ${ids.length} : ${h.nom}`;
    try {
      await run("envoyer", id); n++;
      selected.delete(id);
      h.statut = "envoye"; h.deja_envoye = true;
      render();
    } catch (err) { erreurs.push(err.message); $("#log").textContent = erreurs.slice(-2).join(" · "); }
    if (id !== ids[ids.length - 1] && !stop) {
      const [a, b] = state.delai;
      await sleep((a + Math.random() * (b - a)) * 1000);
    }
  }
  sending = false; $("#btnStop").hidden = true;
  $("#envoi").textContent = `${n} mail(s) envoyé(s)` + (erreurs.length ? `, ${erreurs.length} erreur(s)` : "");
  await refreshState(); await loadHotels();
};

$("#btnHist").onclick = async () => {
  const h = await run("historique");
  $("#histListe").innerHTML = h.length ? h.map(r => `<div><span class="small">${esc(r.envoye_le.replace("T", " "))}</span><br>${esc(r.hotel_nom)} &lt;${esc(r.email)}&gt;</div>`).join("")
                                       : "Aucun envoi pour l'instant.";
  $("#hist").classList.add("open");
};
$("#hClose").onclick = () => $("#hist").classList.remove("open");

(async () => {
  try {
    await refreshState(); await loadRecherches(); await loadHotels(); autoSelect(true);
    if (state.aAnalyser) analyser();   // reprend une analyse en cours
  }
  catch (err) { $("#alerte").hidden = false; $("#alerte").textContent = "Erreur : " + err.message; }
})();
</script>
</body>
</html>
